<div class="form-container">
  <mat-toolbar color="primary" class="toolbar">
    <span>Nowy wydatek</span>
    <span class="spacer"></span>
    <a mat-stroked-button routerLink="/">
      <mat-icon>close</mat-icon> Anuluj
    </a>
  </mat-toolbar>

  <form (ngSubmit)="saveExpense()" #expenseForm="ngForm" class="mat-elevation-z2 form-body">
    <div class="form-group">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="picker" name="date" [(ngModel)]="date" required>
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Kwota</mat-label>
        <input matInput type="number" name="amount" [(ngModel)]="amount" required min="0.01" step="0.01">
        <span matTextPrefix>PLN &nbsp;</span>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Kategoria</mat-label>
        <mat-select name="category" [(ngModel)]="categoryId" required>
          @for (cat of categories; track cat.id) {
            <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Bank / Konto</mat-label>
        <mat-select name="bank" [(ngModel)]="bankId" required>
          @for (bank of banks; track bank.id) {
            <mat-option [value]="bank.id">{{ bank.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Notatki (opcjonalnie)</mat-label>
        <textarea matInput name="notes" [(ngModel)]="notes" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="actions" style="margin-top: 20px;">
      <button mat-flat-button color="primary" type="submit" [disabled]="!expenseForm.form.valid" class="full-width">
        <mat-icon>save</mat-icon> Zapisz wydatek
      </button>
    </div>
  </form>
</div>
