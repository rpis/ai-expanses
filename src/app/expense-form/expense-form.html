<div class="form-container">
  <div class="toolbar">
    <h2>Nowy wydatek</h2>
    <a class="btn btn-secondary" routerLink="/">Anuluj</a>
  </div>

  <form (ngSubmit)="saveExpense()" #expenseForm="ngForm">
    <div class="form-group">
      <label for="date">Data</label>
      <input type="date" id="date" name="date" [(ngModel)]="date" required>
    </div>

    <div class="form-group">
      <label for="amount">Kwota</label>
      <input type="number" id="amount" name="amount" [(ngModel)]="amount" required min="0.01" step="0.01">
    </div>

    <div class="form-group">
      <label for="category">Kategoria</label>
      <select id="category" name="category" [(ngModel)]="categoryId" required>
        <option [ngValue]="null" disabled>Wybierz kategorię</option>
        @for (cat of categories; track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="bank">Bank / Konto</label>
      <select id="bank" name="bank" [(ngModel)]="bankId" required>
        <option [ngValue]="null" disabled>Wybierz bank</option>
        @for (bank of banks; track bank.id) {
          <option [ngValue]="bank.id">{{ bank.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Notatki (opcjonalnie)</label>
      <textarea id="notes" name="notes" [(ngModel)]="notes" rows="3"></textarea>
    </div>

    <div class="actions" style="margin-top: 20px;">
      <button type="submit" class="btn btn-primary" [disabled]="!expenseForm.form.valid">Zapisz wydatek</button>
    </div>
  </form>
</div>
